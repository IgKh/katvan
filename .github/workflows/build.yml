name: Test build the application
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.4.1
        with:
          version: 6.8.*
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmock-dev libhunspell-dev libarchive-dev
          pip install --user mistletoe

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        id: rust_cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: 'build'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --output-on-failure --test-dir build

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.8.*
          cache: true

      - name: Bootstrap vcpkg
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        id: rust_cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: 'build'
          config-dir: 'x64/RelWithDebInfo'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build -j --config RelWithDebInfo

      - name: Run tests
        run: ctest --output-on-failure --test-dir build

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.9.*
          cache: true

      - name: Install dependencies
        run: |
          brew install googletest libarchive bartycrouch
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        id: rust_cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: 'build'

      # Ensures that whatever rust-toolchain installed is before the Homebrew stubs
      - name: Adjust PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --output-on-failure --test-dir build

  analyse:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.11.*
          arch: linux_gcc_64
          cache: true

      - name: Install additional dependencies
        run: |
          sudo add-apt-repository ppa:daschuer/clazy
          sudo apt-get update
          sudo apt-get install -y libgmock-dev libhunspell-dev libarchive-dev clazy

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        id: rust_cache
        uses: ./.github/actions/rust-cache

      - name: Run Clazy
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clazy
          cmake --build build -j

      - name: Run clippy
        run: |
          cargo clippy --no-deps --manifest-path typstdriver/rust/Cargo.toml --target-dir ${{ steps.rust_cache.outputs.cargo-target-dir }}

      - name: Install typos
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: typos

      - name: Check for typos
        run: |
          typos || true
